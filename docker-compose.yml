services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JAMENDO_CLIENT_ID: ""
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [backend]
